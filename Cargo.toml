[package]
name = "kaijucrawl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A desktop catalogue of first successful DriveThruRPG captures"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
ammonia = "4"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
ego-tree = "0.10"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
httpdate = "1"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
quick-xml = "0.38"
tauri = { version = "2", optional = true , features = [] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
robotstxt = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "uuid", "chrono", "json"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4", features = ["crypto-rust", "vendored"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[[example]]
name = "desktop_fixture"
required-features = ["desktop"]

[profile.release]
lto = "thin"
strip = true
